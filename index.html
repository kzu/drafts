<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Drafts</title>
  <meta name="description" content="Random notes agents share with me for preview.">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("theme");
        var dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --radius: 0.625rem;
      --background: oklch(1 0 0);
      --foreground: oklch(0.145 0 0);
      --card: oklch(1 0 0);
      --card-foreground: oklch(0.145 0 0);
      --primary: oklch(0.205 0 0);
      --primary-foreground: oklch(0.985 0 0);
      --secondary: oklch(0.97 0 0);
      --secondary-foreground: oklch(0.205 0 0);
      --muted: oklch(0.97 0 0);
      --muted-foreground: oklch(0.556 0 0);
      --accent: oklch(0.97 0 0);
      --accent-foreground: oklch(0.205 0 0);
      --border: oklch(0.922 0 0);
      --input: oklch(0.922 0 0);
      --ring: oklch(0.708 0 0);
      color-scheme: light;
    }

    html.dark {
      --background: oklch(0.145 0 0);
      --foreground: oklch(0.985 0 0);
      --card: oklch(0.205 0 0);
      --card-foreground: oklch(0.985 0 0);
      --primary: oklch(0.922 0 0);
      --primary-foreground: oklch(0.205 0 0);
      --secondary: oklch(0.269 0 0);
      --secondary-foreground: oklch(0.985 0 0);
      --muted: oklch(0.269 0 0);
      --muted-foreground: oklch(0.708 0 0);
      --accent: oklch(0.269 0 0);
      --accent-foreground: oklch(0.985 0 0);
      --border: oklch(1 0 0 / 10%);
      --input: oklch(1 0 0 / 15%);
      --ring: oklch(0.556 0 0);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--foreground);
      font-family: Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    a { color: inherit; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 3.5rem;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in oklch, var(--background) 80%, transparent);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      text-decoration: none;
    }

    .page {
      width: min(960px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2.5rem 0 4rem;
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: 1.875rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .lede {
      margin: 0.25rem 0 0;
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }

    .toolbar { margin-bottom: 1.5rem; }

    .search { position: relative; display: block; }

    .search svg {
      position: absolute;
      left: 0.75rem;
      top: 50%;
      width: 1rem;
      height: 1rem;
      color: var(--muted-foreground);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .field {
      display: flex;
      width: 100%;
      height: 2.25rem;
      margin: 0;
      padding: 0.25rem 0.75rem 0.25rem 2.25rem;
      border: 1px solid var(--input);
      border-radius: calc(var(--radius) - 2px);
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.875rem;
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      transition: border-color 150ms, box-shadow 150ms;
    }

    html.dark .field { background: color-mix(in oklch, var(--input) 30%, transparent); }

    .field::placeholder { color: var(--muted-foreground); }

    .field:focus-visible,
    .btn:focus-visible {
      outline: none;
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-shrink: 0;
      height: 2.25rem;
      padding: 0.5rem 1rem;
      border: 1px solid transparent;
      border-radius: calc(var(--radius) - 2px);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: background-color 150ms, color 150ms, border-color 150ms;
    }

    .btn svg { display: block; width: 1rem; height: 1rem; }

    .btn-default {
      background: var(--primary);
      color: var(--primary-foreground);
    }

    .btn-default:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }

    .btn-sm { height: 2rem; padding: 0 0.75rem; }

    .btn-outline {
      border-color: var(--border);
      background: var(--background);
      color: var(--foreground);
      box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    html.dark .btn-outline {
      border-color: var(--input);
      background: color-mix(in oklch, var(--input) 30%, transparent);
    }

    .btn-outline:hover {
      background: var(--accent);
      color: var(--accent-foreground);
    }

    html.dark .btn-outline:hover { background: color-mix(in oklch, var(--input) 50%, transparent); }

    .btn-icon { width: 2.25rem; padding: 0; }

    .icon-sun { display: none; }
    html.dark .icon-moon { display: none; }
    html.dark .icon-sun { display: block; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: calc(var(--radius) - 2px);
      background: var(--secondary);
      color: var(--secondary-foreground);
      padding: 0.125rem 0.5rem;
      font-size: 0.75rem;
      font-weight: 500;
      line-height: 1.25rem;
      white-space: nowrap;
    }

    .group + .group { margin-top: 2rem; }

    .group > h2 {
      margin: 0 0 0.75rem;
      color: var(--muted-foreground);
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 800px) {
      .grid { grid-template-columns: 1fr 1fr; }
    }

    .card {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      min-width: 0;
      padding: 1.5rem 0;
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      background: var(--card);
      color: var(--card-foreground);
      box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      transition: border-color 150ms;
    }

    .card:hover { border-color: color-mix(in oklch, var(--foreground) 18%, var(--border)); }

    .card-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      column-gap: 1rem;
      padding: 0 1.5rem;
    }

    .card-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      line-height: 1.25;
    }

    .card-title a { text-decoration: none; }
    .card-title a:hover { text-decoration: underline; text-underline-offset: 4px; }

    .card-description {
      margin: 0.375rem 0 0;
      overflow-wrap: anywhere;
      color: var(--muted-foreground);
      font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
      font-size: 0.75rem;
    }

    .card-header .btn { grid-column: 2; grid-row: 1 / span 2; }

    .outline {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin: 0;
      padding: 0 1.5rem;
      list-style: none;
    }

    .outline li {
      padding-left: calc((var(--level) - 1) * 0.75rem);
      color: var(--muted-foreground);
      font-size: 0.875rem;
      line-height: 1.4;
    }

    .outline a { color: inherit; text-decoration: none; }
    .outline a:hover { color: var(--foreground); text-decoration: underline; text-underline-offset: 4px; }

    .empty {
      margin: 2rem 0 0;
      color: var(--muted-foreground);
      font-size: 0.875rem;
    }

    @media (max-width: 560px) {
      .topbar, .page { padding-left: 1rem; padding-right: 1rem; }
      .page { width: 100%; }
      .page-header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html">Drafts</a>
    <button type="button" id="theme" class="btn btn-outline btn-icon" aria-label="Switch to dark theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2"></path>
        <path d="M12 20v2"></path>
        <path d="m4.93 4.93 1.41 1.41"></path>
        <path d="m17.66 17.66 1.41 1.41"></path>
        <path d="M2 12h2"></path>
        <path d="M20 12h2"></path>
        <path d="m6.34 17.66-1.41 1.41"></path>
        <path d="m19.07 4.93-1.41 1.41"></path>
      </svg>
    </button>
  </header>

  <main class="page">
    <div class="page-header">
      <div>
        <h1>Index</h1>
        <p class="lede">Random notes agents share with me for preview.</p>
      </div>
      <span id="count" class="badge">0 pages</span>
    </div>

    <div class="toolbar">
      <label class="search">
        <span class="sr-only">Search pages</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input id="query" class="field" type="search" placeholder="Search titles, paths, and headings" autocomplete="off" spellcheck="false">
      </label>
    </div>

    <div id="list"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <script src="drafts.js"></script>
  <script>
    (function () {
      var files = window.DRAFTS && Array.isArray(window.DRAFTS.files) ? window.DRAFTS.files : [];
      var list = document.getElementById("list");
      var empty = document.getElementById("empty");
      var count = document.getElementById("count");
      var query = document.getElementById("query");
      var theme = document.getElementById("theme");

      function esc(value) {
        return String(value).replace(/[&<>"']/g, function (ch) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
        });
      }

      function href(path, id) {
        var url = String(path).split("/").map(encodeURIComponent).join("/");
        return id ? url + "#" + encodeURIComponent(id) : url;
      }

      function directory(path) {
        var slash = String(path).lastIndexOf("/");
        return slash === -1 ? "" : String(path).slice(0, slash);
      }

      function matches(file, q) {
        if (!q) return true;
        var haystack = [file.title, file.path].concat((file.headings || []).map(function (heading) {
          return heading.text;
        })).join("\n").toLowerCase();
        return haystack.indexOf(q) !== -1;
      }

      function sections(matched) {
        var groups = [];
        var index = {};
        matched.forEach(function (file) {
          var dir = directory(file.path);
          if (index[dir] == null) {
            index[dir] = groups.length;
            groups.push({ dir: dir, files: [] });
          }
          groups[index[dir]].files.push(file);
        });
        return groups;
      }

      function outline(file) {
        var headings = file.headings || [];
        if (!headings.length) return "";
        return '<ul class="outline">' + headings.map(function (heading) {
          var level = Math.min(6, Math.max(1, Number(heading.level) || 1));
          var text = esc(heading.text);
          var label = heading.id
            ? '<a href="' + esc(href(file.path, heading.id)) + '">' + text + "</a>"
            : text;
          return '<li style="--level:' + level + '">' + label + "</li>";
        }).join("") + "</ul>";
      }

      function card(file, nested) {
        var tag = nested ? "h3" : "h2";
        var body = outline(file);
        return '<article class="card" data-slot="card">' +
          '<div class="card-header" data-slot="card-header">' +
            "<div>" +
              "<" + tag + ' class="card-title" data-slot="card-title"><a href="' + esc(href(file.path)) + '">' + esc(file.title) + "</a></" + tag + ">" +
              '<p class="card-description" data-slot="card-description">' + esc(file.path) + "</p>" +
            "</div>" +
            '<a class="btn btn-default btn-sm" href="' + esc(href(file.path)) + '">Open</a>' +
          "</div>" +
          body +
        "</article>";
      }

      function render() {
        var q = query.value.trim().toLowerCase();
        var matched = files.filter(function (file) { return matches(file, q); });
        var grouped = sections(matched);
        var showTitles = grouped.length > 1 || (grouped[0] && grouped[0].dir);
        list.innerHTML = grouped.map(function (group) {
          var heading = showTitles && group.dir ? "<h2>" + esc(group.dir) + "</h2>" : "";
          var cards = group.files.map(function (file) {
            return card(file, Boolean(showTitles && group.dir));
          }).join("");
          return '<section class="group">' + heading + '<div class="grid">' + cards + "</div></section>";
        }).join("");

        var noun = matched.length === 1 ? "page" : "pages";
        count.textContent = q && matched.length !== files.length
          ? matched.length + " of " + files.length
          : matched.length + " " + noun;

        var message = "";
        if (!files.length) message = "No HTML pages in this repo yet.";
        else if (!matched.length) message = "No pages match that search.";
        empty.hidden = !message;
        empty.textContent = message;
      }

      function syncThemeButton() {
        var dark = document.documentElement.classList.contains("dark");
        theme.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }

      theme.addEventListener("click", function () {
        var dark = document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", dark ? "dark" : "light");
        syncThemeButton();
      });

      query.addEventListener("input", render);
      syncThemeButton();
      render();
    })();
  </script>
</body>
</html>
